[package]
name = "imos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Immutable object store for deterministic artifact installation"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
